<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>See your flowers</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; --muted: #6b6b6b; --line: #e6e6e6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0e; --fg: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px 96px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input { flex: 1; min-width: 0; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--fg); color: var(--bg); cursor: pointer; }
  .status { color: var(--muted); font-size: 14px; min-height: 20px; margin-bottom: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 14px 0; border-top: 1px solid var(--line); }
  li a { color: inherit; font-weight: 700; }
  li span { display: block; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>See your flowers</h1>
  <p>Made a shader, a UI kit, a font or a snippet? Search for your name, @handle, or a link to your profile or tool to see the sites that gave you flowers.</p>
  <form id="f"><input id="q" type="search" placeholder="@handle, name or link" aria-label="Your name, handle or link" autofocus><button>Search</button></form>
  <div class="status" id="status" aria-live="polite"></div>
  <ul id="results"></ul>
</main>
<script>
  // the same matching as tools/lib.mjs
  const bare = (u) => { try { const x = new URL(/^https?:\/\//i.test(u) ? u : 'https://' + u); return (x.hostname.replace(/^www\./, '') + x.pathname.replace(/\/+$/, '')).toLowerCase(); } catch { return String(u).toLowerCase(); } };
  function matches(c, q) {
    q = q.trim(); if (!q) return false;
    if (/^https?:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+\//.test(q) || /^[\w-]+\.[a-z]{2,}$/i.test(q)) {
      const b = bare(q);
      return [c.url, c.authorUrl].filter(Boolean).some((u) => { const x = bare(u); return x === b || x.startsWith(b + '/'); });
    }
    const w = q.replace(/^@/, '').toLowerCase();
    return [c.author, c.name, c.authorUrl].filter(Boolean).some((s) => s.toLowerCase().includes(w));
  }
  const $ = (id) => document.getElementById(id);
  const index = fetch('index.json').then((r) => r.json()).catch(() => ({ sites: [] }));
  index.then((d) => { $('status').textContent = d.sites.length ? d.sites.length + ' sites listed' + (d.generated ? ', updated ' + new Date(d.generated).toLocaleDateString() : '') + '.' : 'No sites are listed yet.'; });
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = $('q').value, d = await index, out = $('results');
    out.textContent = '';
    let n = 0;
    for (const s of d.sites) for (const c of s.credits) {
      if (!matches(c, q)) continue;
      n++;
      const li = document.createElement('li'), a = document.createElement('a'), span = document.createElement('span');
      a.href = /^https?:\/\//.test(s.site) ? s.site : '#'; a.textContent = s.name || s.site; a.target = '_blank'; a.rel = 'noopener';
      span.textContent = c.name + (c.author ? ' by ' + c.author : '') + (c.note ? ' · ' + c.note : '');
      li.append(a, span); out.append(li);
    }
    $('status').textContent = n ? n + (n === 1 ? ' site gave' : ' sites gave') + ' you flowers.' : 'No flowers found for that yet.';
  });
</script>
</body>
</html>
