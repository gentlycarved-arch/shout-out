name: Rebuild the credits index
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths: ['registry/sites.txt']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-index.mjs
      - run: |
          git config user.name "flowers-index"
          git config user.email "flowers-index@users.noreply.github.com"
          git add docs/index.json
          git diff --cached --quiet || (git commit -m "Rebuild the credits index" && git push)
