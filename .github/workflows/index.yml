name: Rebuild the credits and makers lists
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['registry/*.txt']
permissions:
  contents: write
concurrency: registry
jobs:
  index:
    # only on main: a tag or another branch has nowhere to save the list
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-index.mjs
      - run: |
          git config user.name "shoutout-index"
          git config user.email "shoutout-index@users.noreply.github.com"
          git add docs/index.json docs/makers.json
          git diff --cached --quiet || (git commit -m "Rebuild the credits and makers lists" && git push)
